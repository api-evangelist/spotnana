        roomAmenityPrefs:
          type: array
          items:
            type: string
            description: Amenity preference of the room.
            enum:
            - FEATHER_FREE_ROOM
            - EXTRA_TOWELS
            - REFRIGERATOR
            example: EXTRA_TOWELS
