      enum:
      - PNR
      - COMPANY
      - AIR_ITINERARY
      - EVENT
      - LOCATION_IMAGE
      - AIR_COMMISSION_CONTRACT
      example: PNR
      x-ignoreBreakingChanges:
      - EntityType->TRIP
      - EntityType->TICKETING_ERROR
