aid: spotnana
name: Spotnana
description: Spotnana is a travel-as-a-service platform that powers corporate travel for travel management
  companies, enterprises, and partners through a modern, API-first booking and management stack. Its public
  developer platform exposes 11 REST APIs — Authentication, Users, Company, Policy, Trip, Air, Hotel,
  Event, Event Template, Payments, and Document — spanning ~211 operations for shopping and booking flights,
  hotels, and cars, managing trips and PNRs, modeling company structure and travel policy, running group
  events, and handling payments and documents. APIs use OAuth2 (client-credentials and RFC 8693 token-exchange)
  Bearer auth, a documented webhook surface for booking-lifecycle events, a dated changelog, an Atlassian
  status page, and a Redocly-hosted documentation MCP server.
